[package]
name = "cmp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fast32 = { path = "../" }

[dev-dependencies]
# for bench comparison: https://github.com/andreasots/base32
base32 = "0.4.0"
criterion = "0.5.1"
# for bench comparison: https://github.com/archer884/crockford
crockford = "1.2.1"
# for bench comparison: https://github.com/ia0/data-encoding
data-encoding = "2.5.0"
data-encoding-macro = "0.1.14"
# Reference implementation from https://github.com/rogusdev/fast32
fast32-reference = { git = "https://github.com/rogusdev/fast32", package = "fast32" }

[[bench]]
name = "comparisons"
harness = false

[[bench]]
name = "reference_comparison"
harness = false
